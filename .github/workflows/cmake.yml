name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
